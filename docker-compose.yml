version: '3.8'

# 使用replica时,无法使用basic身份认证
services:
  #  mongodb://root:example@mongo1:30001,mongo2:30002,mongo3:30003/test_db/?replicaSet=my-replica-set&authSource=admin
  mongo1:
    image: mongo:4.2
    container_name: mongo1
    command: [ "--replSet", "my-replica-set", "--bind_ip_all", "--port", "30001" ]
    volumes:
      - ./data/mongo-1:/data/db
    ports:
      - "30001:30001"
    healthcheck:
      # 本机运行需要添加hosts https://stackoverflow.com/questions/68674897/mongodb-docker-replica-set-connection-error-host-not-found
      test: test $$(echo "rs.initiate({_id:'my-replica-set',members:[{_id:0,host:\"mongo1:30001\"},{_id:1,host:\"mongo2:30002\"}]}).ok || rs.status().ok" | mongo --port 30001 --quiet) -eq 1
      #      test: test $$(echo "rs.initiate({_id:'my-replica-set',members:[{_id:0,host:\"mongo1:30001\"},{_id:1,host:\"mongo2:30002\"},{_id:2,host:\"mongo3:30003\"}]}).ok || rs.status().ok" | mongo --port 30001 --quiet) -eq 1
      interval: 10s
      start_period: 30s

  mongo2:
    image: mongo:4.2
    container_name: mongo2
    command: [ "--replSet", "my-replica-set", "--bind_ip_all", "--port", "30002" ]
    volumes:
      - ./data/mongo-2:/data/db
    ports:
      - "30002:30002"
  #  mongo3:
  #    image: mongo:4.2
  #    container_name: mongo3
  #    command: [ "--replSet", "my-replica-set", "--bind_ip_all", "--port", "30003" ]
  #    volumes:
  #      - ./data/mongo-3:/data/db
  #    ports:
  #      - "30003:30003"

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "27018:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://mongo1:30001/
#      ME_CONFIG_MONGODB_URL: mongodb://mongo1:30001,mongo2:30002,mongo3:30003/?replicaSet=my-replica-set
#      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/